[project]
name = "spotify-votify-vercel"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "imageio-ffmpeg==0.6.0",
    "librespot==0.0.10",
    "votify==1.9.9",
]

[tool.uv]
package = false
# Votify needs protobuf 6; its CLI uses the pure-Python runtime for librespot's older bindings.
override-dependencies = ["protobuf==6.33.6"]
